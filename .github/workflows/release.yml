name: Publish release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish (for example 2026.3.6)
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: [self-hosted, dvt-mirror]
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable X.Y.Z tags may be published" >&2
            exit 2
          }
          actual_tag="$(git describe --tags --exact-match HEAD)"
          test "${actual_tag}" = "${RELEASE_TAG}"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uvx --from twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: [self-hosted, dvt-mirror]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
